apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskapi.fullname" . }}-db
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- $password := required "postgres.password is required: --set postgres.password=..." .Values.postgres.password }}
  password: {{ $password | quote }}
  url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user ($password | urlquery) (include "taskapi.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  url: {{ required "externalDatabaseUrl is required when postgres.enabled=false" .Values.externalDatabaseUrl | quote }}
  {{- end }}
